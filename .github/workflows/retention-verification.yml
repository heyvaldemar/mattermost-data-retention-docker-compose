name: Retention Script Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly run to catch environment drift.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: retention-verification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint shell scripts and workflow YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck-alpine:stable \
            shellcheck ./*.sh tests/*.sh

      - name: actionlint (GitHub Actions workflow linting)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            rhysd/actionlint:1.7.12 \
            -color

  retention-test:
    name: Run the retention script against a real Postgres and data volume, and show the test each violation
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A real PostgreSQL with Mattermost-shaped tables and a stand-in data
      # volume; posts and uploads 60 days, 20 days and 0 days old; the script
      # run with RETENTION=30, and only the 60-day-old data may be gone.
      - name: End-to-end retention test
        run: ./tests/e2e-retention.sh

      # A test that cannot fail is not a test: each promise is broken on a
      # copy of the script, and the run fails if the test stays green.
      - name: The test, shown each violation it exists for
        run: python3 tests/plant-violations.py -- ./tests/e2e-retention.sh

  discovery-test:
    name: Two stacks on one host, and the script finds its own containers
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Two compose projects run the same Mattermost-shaped stack side by side
      # (tests/discovery-compose.yml), each with a postgres service and a
      # backups container on the same image. Every run of the script is
      # checked against both: the project it was pointed at, or found, loses
      # its expired data, and the other keeps every row and file.
      - name: Two stacks on one host, and the script deletes from its own
        run: ./tests/e2e-discovery.sh

      - name: The two-stack test, shown each wrong discovery
        run: python3 tests/plant-violations.py --plants tests/plants-discovery.tsv -- ./tests/e2e-discovery.sh
